name: Terraform Apply

on:
  push:
    branches:
      - main

jobs:
  apply-dev:

    runs-on: ubuntu-latest

    environment:
      name: development

    defaults:
      run:
        working-directory: terraform-ci-demo/terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="backend/dev.hcl"

      - name: Terraform Apply
        run: terraform apply -auto-approve --var-file="environments/dev.tfvars"
        env:
          TF_VAR_my_ip: ${{ secrets.MY_IP }}

  apply-prod:

    needs: apply-dev
    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: terraform-ci-demo/terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend-config="backend/prod.hcl"

      - name: Terraform Apply
        run: terraform apply -auto-approve --var-file="environments/prod.tfvars"
        env:
          TF_VAR_my_ip: ${{ secrets.MY_IP }}
